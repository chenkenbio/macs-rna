[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macs-rna"
version = "0.1.0"
description = "Strand-specific MACS3 peak calling for RNA-seq data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ken Chen", email = "chenkenbio@gmail.com" },
]
dependencies = [
    "macs3>=3.0.4",
    "pyyaml",
]

[project.scripts]
macs-rna = "macs_rna.cli:main"

[project.urls]
Repository = "https://github.com/chenkenbio/macs-rna"

# --- Build the bundled macs3-rs accelerator into the wheel ---
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# Include any pre-built accelerator binary in the source tree (e.g. from
# `macs-rna build-accel`); the build hook also force-includes a freshly built
# binary. Listed as an artifact so it ships even when _accel/ is gitignored.
artifacts = [
    "macs_rna/_accel/macs3-rs",
]
